name: Deploy DevTinder Backend to EC2

on:
  push:
    branches:
      - main  # or master
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    if: ${{ startsWith(github.event.head_commit.message, 'deploy:') || startsWith(github.event.head_commit.message, 'DEPLOY:') || startsWith(github.event.head_commit.message, 'Deploy:') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Backend Code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./*"
          target: "/tmp/devtinder-be-source"

      - name: Install Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Load NVM / system environment paths so npm and pm2 commands are recognized
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:$HOME/.nvm/versions/node/$(nvm current 2>/dev/null)/bin

            # Create app folder if it doesn't exist
            mkdir -p ~/devtinder-be
            
            # Sync source files into app folder (preserving .env)
            rsync -av --exclude='.env' /tmp/devtinder-be-source/ ~/devtinder-be/
            rm -rf /tmp/devtinder-be-source
            
            # Navigate to folder, install dependencies, restart PM2
            cd ~/devtinder-be
            npm ci --production
            pm2 restart all --update-env || pm2 start app.js --name "dt-be"